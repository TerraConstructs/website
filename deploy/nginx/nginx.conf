server {
    listen 80;
    server_name terraconstructs.dev;
    root /var/www/terraconstructs;
    index index.html;

    # Security Headers
    add_header X-Frame-Options DENY always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # Generate nonce and set CSP header
    location / {
        # Generate random nonce using lua
        access_by_lua_block {
            local resty_random = require "resty.random"
            local str = require "resty.string"
            
            -- Generate 16-byte random nonce
            local random_bytes = resty_random.bytes(16)
            local nonce = str.to_hex(random_bytes)
            
            -- Set nonce in nginx variable
            ngx.var.csp_nonce = nonce
            
            -- Set CSP header with nonce
            local csp = string.format([[
                default-src 'self';
                script-src 'self' https://cdn.tailwindcss.com 'nonce-%s';
                style-src 'self' https://fonts.googleapis.com 'nonce-%s';
                img-src 'self' data:;
                font-src 'self' https://fonts.gstatic.com;
                connect-src 'self';
                frame-ancestors 'none';
                base-uri 'self';
                form-action 'self';
            ]], nonce, nonce)
            
            ngx.header["Content-Security-Policy"] = csp:gsub("%s+", " ")
        }

        # Replace __CSP_NONCE__ with actual nonce in response
        sub_filter '__CSP_NONCE__' $csp_nonce;
        sub_filter_once off;
        sub_filter_types text/html;

        try_files $uri $uri/ =404;
    }

    # Static assets with caching
    location ~* \.(css|js|png|jpg|jpeg|gif|svg|ico|woff|woff2)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options nosniff always;
    }

    # Logos directory
    location /logos/ {
        expires 30d;
        add_header Cache-Control "public";
    }
}

# SSL Configuration (recommended)
server {
    listen 443 ssl http2;
    server_name terraconstructs.dev;
    
    ssl_certificate /path/to/certificate.crt;
    ssl_certificate_key /path/to/private.key;
    
    # Include the same configuration as above
    include /etc/nginx/conf.d/terraconstructs-common.conf;
}